.sans{font-family:Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.t-text{fill:var(--text)} .t-muted{fill:var(--muted)} .t-accent{fill:var(--accent)}
